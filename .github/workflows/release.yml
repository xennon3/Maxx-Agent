name: Release

# Push a tag like v0.2.0-preview to build maxx.exe on Windows and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun build src/cli.ts --compile --target=bun-windows-x64 --outfile dist/maxx.exe
      - name: Smoke test
        run: ./dist/maxx.exe --help
        shell: bash
      - name: Zip and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/maxx.exe -DestinationPath maxx-windows-x64.zip
          $h = (Get-FileHash maxx-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  maxx-windows-x64.zip" | Out-File -Encoding ascii maxx-windows-x64.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            maxx-windows-x64.zip
            maxx-windows-x64.zip.sha256
          body: |
            Windows x64 build of Maxx. Unzip, then run `maxx.exe doctor` with LM Studio's server running.
            The exe is unsigned, so SmartScreen may warn: More info → Run anyway.
            Needs Git for Windows for the bash tool; Android Studio (adb, SDK, JDK) for `--with android`.
